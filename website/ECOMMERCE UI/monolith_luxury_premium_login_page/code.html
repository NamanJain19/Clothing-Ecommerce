<script>
        // Subtle Parallax effect on the left image
        window.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.005;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.005;
            const image = document.querySelector('section.hidden.md\\:block div');
            if(image) {
                image.style.transform = `scale(1.05) translate(${moveX}px, ${moveY}px)`;
            }
        });

        // Form focus styles
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.replace('text-secondary', 'text-primary');
            });
            input.addEventListener('blur', () => {
                if (!input.value) {
                    input.parentElement.querySelector('label').classList.replace('text-primary', 'text-secondary');
                }
            });
        });
    </script>
