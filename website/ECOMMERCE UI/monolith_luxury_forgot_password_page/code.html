<!-- Micro-interaction Script -->
<script>
        function handleRecovery(event) {
            event.preventDefault();
            const button = event.target.querySelector('button');
            const originalText = button.innerText;
            
            // Visual feedback
            button.disabled = true;
            button.innerText = "SENDING...";
            button.style.opacity = "0.7";

            setTimeout(() => {
                button.innerText = "LINK SENT";
                button.classList.remove('bg-primary');
                button.classList.add('bg-on-tertiary-container');
                
                // Show success state (simulated)
                const form = document.getElementById('recoveryForm');
                form.innerHTML = `
                    <div class="text-center py-8 animate-in fade-in duration-500">
                        <span class="material-symbols-outlined text-[48px] text-primary mb-4" style="font-variation-settings: 'FILL' 1">check_circle</span>
                        <p class="font-body-md text-body-md text-primary mb-2">Instructions Sent</p>
                        <p class="font-body-md text-body-md text-secondary">Please check your inbox at ${document.getElementById('email').value}</p>
                        <button onclick="location.reload()" class="mt-8 font-label-caps text-label-caps text-primary underline underline-offset-8">Try Again</button>
                    </div>
                `;
            }, 1500);
        }

        // Handle focus states for luxury feel
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.style.transform = 'translateY(-2px)';
                input.parentElement.style.transition = 'transform 0.3s ease';
            });
            input.addEventListener('blur', () => {
                input.parentElement.style.transform = 'translateY(0)';
            });
        });
    </script>
