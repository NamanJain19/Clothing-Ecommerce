<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .input-underline {
      border: none;
      border-bottom: 1px solid #000000;
      background: transparent;
      padding: 12px 0;
      outline: none;
      transition: border-color 0.3s ease;
    }
    .input-underline:focus {
      border-bottom: 1px solid #7e7576;
      box-shadow: none;
    }
    .fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen selection:bg-primary selection:text-on-primary">
<!-- Main Content Shell -->
<main class="flex flex-col md:flex-row min-h-screen w-full overflow-hidden">
<!-- Left: Editorial Column -->
<section class="hidden md:block md:w-1/2 lg:w-7/12 relative h-screen bg-surface-container overflow-hidden">
<div class="absolute inset-0 transition-transform duration-[2000ms] ease-out hover:scale-105">
<img alt="Editorial fashion portrait" class="w-full h-full object-cover grayscale brightness-95" src="https://lh3.googleusercontent.com/aida/AP1WRLstQ-t_BKdLJTMOe57cDvBzNV9OdnMaFENbnzIvKVDenP0nPwHK8nBImh9CSUaQoziP-XhfZFUE4Z8dSWOLRLC4WmLGdWUOiVH3AouzWdChpdCD8v6qcncmP7Lbc3g09DfZXFJ3p80pE9cqHKqETR7Ft4xrv0Wzlx9mW-0t8P5oTV2ESEx5QV3401dDROHbZFa7rD9k9lxJTrlQ9qJS6oV6btCjl1kjEdDcBpenweg2H3duoHO1jLr1UGk4">
</div>
<!-- Logo Overlay for Authentication Flow -->
<div class="absolute top-margin-desktop left-margin-desktop z-10">
<h1 class="font-headline-md text-headline-md tracking-widest text-primary">MONOLITH</h1>
</div>
</section>
<!-- Right: Authentication Form Column -->
<section class="w-full md:w-1/2 lg:w-5/12 flex items-center justify-center bg-surface px-margin-mobile md:px-margin-desktop py-12 h-screen overflow-y-auto">
<!-- Mobile Logo -->
<div class="absolute top-8 left-margin-mobile md:hidden">
<h1 class="font-headline-md text-headline-md tracking-widest text-primary">MONOLITH</h1>
</div>
<div class="w-full max-w-md fade-in">
<div class="mb-12">
<h2 class="font-headline-md text-headline-md text-primary mb-4">Reset Password</h2>
<p class="font-body-md text-secondary max-w-xs">Please enter your new credentials below to secure your account.</p>
</div>
<form action="#" class="space-y-8" onsubmit="return false;">
<div class="flex flex-col space-y-2">
<label class="font-label-caps text-label-caps text-secondary" for="new_password">NEW PASSWORD</label>
<div class="relative flex items-center">
<input class="input-underline w-full font-body-md text-primary placeholder-outline-variant" id="new_password" name="new_password" placeholder="••••••••" type="password">
<button class="absolute right-0 text-secondary hover:text-primary transition-colors duration-300" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="flex flex-col space-y-2">
<label class="font-label-caps text-label-caps text-secondary" for="confirm_password">CONFIRM PASSWORD</label>
<div class="relative flex items-center">
<input class="input-underline w-full font-body-md text-primary placeholder-outline-variant" id="confirm_password" name="confirm_password" placeholder="••••••••" type="password">
<button class="absolute right-0 text-secondary hover:text-primary transition-colors duration-300" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="pt-6">
<button class="w-full bg-primary text-on-primary font-button text-button py-5 tracking-[0.2em] hover:bg-secondary transition-all duration-500 ease-in-out group flex items-center justify-center" type="submit">
              UPDATE PASSWORD
              <span class="material-symbols-outlined ml-3 text-[18px] opacity-0 group-hover:opacity-100 transition-all duration-500 translate-x-[-10px] group-hover:translate-x-0">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-12 text-center">
<a class="font-label-caps text-label-caps text-secondary hover:text-primary transition-all duration-300 relative inline-block after:content-[''] after:absolute after:bottom-[-4px] after:left-0 after:w-0 after:h-[1px] after:bg-primary hover:after:w-full after:transition-all after:duration-500" href="#">
            BACK TO LOGIN
          </a>
</div>
</div>
</section>
</main>
<!-- Atmospheric Background Interaction -->
<script>
    document.addEventListener('mousemove', (e) => {
      const x = e.clientX / window.innerWidth;
      const y = e.clientY / window.innerHeight;
      
      const images = document.querySelectorAll('img');
      images.forEach(img => {
        const moveX = (x - 0.5) * 15;
        const moveY = (y - 0.5) * 15;
        img.style.transform = `scale(1.05) translate(${moveX}px, ${moveY}px)`;
      });
    });

    // Password visibility toggle micro-interaction
    const toggleButtons = document.querySelectorAll('button[type="button"]');
    toggleButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.previousElementSibling;
        const icon = btn.querySelector('.material-symbols-outlined');
        if (input.type === 'password') {
          input.type = 'text';
          icon.innerText = 'visibility';
        } else {
          input.type = 'password';
          icon.innerText = 'visibility_off';
        }
      });
    });
  </script>
</body></html>
