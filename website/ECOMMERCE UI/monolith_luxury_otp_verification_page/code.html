<script>
        // OTP Input Auto-advance logic
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Countdown Timer Logic
        let timeLeft = 45;
        const timerText = document.getElementById('time');
        const timerContainer = document.getElementById('timer');
        const postLinks = document.getElementById('post-timer-links');

        const countdown = setInterval(() => {
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerText.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerContainer.classList.add('hidden');
                postLinks.classList.remove('hidden');
                postLinks.classList.add('flex');
            }
        }, 1000);

        // Form Submit Interaction
        document.getElementById('otp-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = 'VERIFYING...';
            btn.disabled = true;
            btn.classList.add('opacity-50');
            
            setTimeout(() => {
                // Simulate success
                window.location.reload(); 
            }, 1500);
        });
    </script>
